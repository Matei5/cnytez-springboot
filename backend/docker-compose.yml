
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reddit-backend
    # restart automatically after ec2 reboots or crashes
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # overrides the application's environment variables, making backend connect to 'db'
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cnytez_db
      SPRING_DATASOURCE_USERNAME: postgres
      # password is loaded from .env file, never hardcoded
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODERATION_TIMEOUT: ${MODERATION_TIMEOUT:-10s}
    # wait for db to be ready before starting, not just running
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # prevent docker logs from filling the ec2 disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: reddit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cnytez_db
    volumes:
      # data is saved on volume so that database information isn't lost after stop
      - postgres_data:/var/lib/postgresql/data
      # initialize baseline schema on empty databases for fresh local setups
      - ./src/test/resources/db/legacy-schema.sql:/docker-entrypoint-initdb.d/01-legacy-schema.sql:ro
    # check that postgres accepts connections before marking the service healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cnytez_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
