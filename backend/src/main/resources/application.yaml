spring:
  application:
    name: app

  datasource:
    # env vars set by docker-compose; fallback values used for local development
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reddit}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:1234}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway changes the DB, Hibernate only does checks
    show-sql: true

  sql:
    init:
      mode: "never" # don't run the data.sql anymore

  flyway:
    baseline-on-migrate: true # the EC2 DB is already made, the baseline is set
    baseline-version: 1 # our baseline is at version 1, apply migrations from 2 onward

image-server:
  url: "http://ec2-18-193-138-107.eu-central-1.compute.amazonaws.com:8123"

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}

  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      show-details: never

monitoring:
  global-statistics:
    refresh-interval-ms: 60000
