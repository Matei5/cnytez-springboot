spring:
  application:
    name: app

  datasource:
    # env vars set by docker-compose; fallback values used for local development
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reddit}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:1234}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # flyway changes the database; hibernate only validates it
    show-sql: true

  sql:
    init:
      mode: "never" # don't run the data.sql anymore

  flyway:
    baseline-on-migrate: true # the ec2 database already exists, so flyway uses a baseline
    baseline-version: 1 # our baseline is at version 1, apply migrations from 2 onward

  servlet:
    multipart:
      max-file-size: 5MB

image-server:
  url: "http://ec2-18-193-138-107.eu-central-1.compute.amazonaws.com:8123"

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "never"
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"
