name: Deploy image server to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  actions: read
  contents: read

concurrency:
  group: image-server-production
  cancel-in-progress: false

jobs:
  changes:
    name: Check for image-server changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}

    steps:
      - name: Download CI deployment decisions
        uses: actions/download-artifact@v4
        with:
          name: deployment-changes
          path: deployment-decision
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate image-server decision
        id: decision
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          FILE=deployment-decision/deployment-changes.json
          jq --exit-status \
            --arg head "$HEAD_SHA" \
            '.head == $head and (.image_server | type == "boolean")' \
            "$FILE" >/dev/null

          DEPLOY=$(jq --raw-output '.image_server' "$FILE")
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Image-server deployment required: $DEPLOY"

  deploy:
    name: Deploy CI-approved image server
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out the CI-approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          IMAGE_EC2_SSH_KEY: ${{ secrets.IMAGE_EC2_SSH_KEY }}
          IMAGE_EC2_KNOWN_HOSTS: ${{ secrets.IMAGE_EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$IMAGE_EC2_SSH_KEY" > ~/.ssh/image_ec2_key
          chmod 600 ~/.ssh/image_ec2_key
          printf '%s\n' "$IMAGE_EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with health verification and rollback
        env:
          IMAGE_EC2_HOST: ${{ secrets.IMAGE_EC2_HOST }}
          IMAGE_EC2_USER: ${{ secrets.IMAGE_EC2_USER }}
          IMAGE_EC2_APP_DIR: ${{ vars.IMAGE_EC2_APP_DIR }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HOST=$(printf '%s' "$IMAGE_EC2_HOST" | tr -d '[:space:]')
          USER=$(printf '%s' "$IMAGE_EC2_USER" | tr -d '[:space:]')
          APP_DIR=${IMAGE_EC2_APP_DIR:-/home/ec2-user/cnytez-springboot}

          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          scp \
            -i ~/.ssh/image_ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            image-server/scripts/deploy-with-rollback.sh \
            "$USER@$HOST:/tmp/cnytez-deploy-image-server.sh"

          ssh \
            -i ~/.ssh/image_ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "chmod 700 /tmp/cnytez-deploy-image-server.sh && /tmp/cnytez-deploy-image-server.sh '$APP_DIR' '$DEPLOY_SHA'"
