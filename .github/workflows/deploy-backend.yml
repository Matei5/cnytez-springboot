name: Deploy backend to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CI-approved backend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out the CI-approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.BACKEND_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BACKEND_AWS_REGION }}
          allowed-account-ids: "386807259133"
          role-session-name: backend-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Publish the CI-approved backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$ECR_REGISTRY" == "386807259133.dkr.ecr.us-east-1.amazonaws.com" ]]
          [[ "$ECR_REPOSITORY" == "cnytez-backend" ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "The immutable image already exists; reusing it"
          else
            docker build --tag "$IMAGE" backend
            docker push "$IMAGE"
          fi

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text

      - name: Deploy through Systems Manager
        env:
          BACKEND_EC2_INSTANCE_ID: ${{ vars.BACKEND_EC2_INSTANCE_ID }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_AWS_REGION: ${{ vars.BACKEND_AWS_REGION }}
          BACKEND_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
        run: |
          APP_DIR=${EC2_APP_DIR:-/home/ec2-user/cnytez-springboot}

          [[ "$BACKEND_EC2_INSTANCE_ID" == "i-031276f200be2c15b" ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_AWS_REGION" == "us-east-1" ]]
          [[ "$BACKEND_ECR_REPOSITORY" == "cnytez-backend" ]]

          BACKEND_IMAGE="386807259133.dkr.ecr.$BACKEND_AWS_REGION.amazonaws.com/$BACKEND_ECR_REPOSITORY:$DEPLOY_SHA"
          SCRIPT_B64=$(base64 --wrap=0 backend/scripts/deploy-with-rollback.sh)
          REMOTE_COMMAND="printf '%s' '$SCRIPT_B64' | base64 --decode > /tmp/cnytez-deploy-backend.sh && chown ec2-user:ec2-user /tmp/cnytez-deploy-backend.sh && chmod 700 /tmp/cnytez-deploy-backend.sh && runuser -u ec2-user -- env HOME=/home/ec2-user /tmp/cnytez-deploy-backend.sh '$APP_DIR' '$DEPLOY_SHA' '$BACKEND_IMAGE'"

          jq --null-input \
            --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BACKEND_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 900 \
            --comment "Deploy backend $DEPLOY_SHA" \
            --query 'Command.CommandId' \
            --output text)

          [[ "$COMMAND_ID" =~ ^[0-9a-f-]{36}$ ]]

          for ((attempt = 1; attempt <= 180; attempt++)); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$BACKEND_EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$BACKEND_EC2_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          [[ "$STATUS" == "Success" ]]
