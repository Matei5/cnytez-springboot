name: Deploy backend to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CI-approved backend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out the CI-approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.BACKEND_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BACKEND_AWS_REGION }}
          allowed-account-ids: "386807259133"
          role-session-name: backend-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Publish the CI-approved backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$ECR_REGISTRY" == "386807259133.dkr.ecr.us-east-1.amazonaws.com" ]]
          [[ "$ECR_REPOSITORY" == "cnytez-backend" ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE" backend
          docker push "$IMAGE"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with health verification and rollback
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HOST=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          USER=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')
          APP_DIR=${EC2_APP_DIR:-/home/ec2-user/cnytez-springboot}

          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          scp \
            -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            backend/scripts/deploy-with-rollback.sh \
            "$USER@$HOST:/tmp/cnytez-deploy-backend.sh"

          ssh \
            -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "chmod 700 /tmp/cnytez-deploy-backend.sh && /tmp/cnytez-deploy-backend.sh '$APP_DIR' '$DEPLOY_SHA'"
